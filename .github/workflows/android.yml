name: Build Android APK + AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner ships with the Android SDK preinstalled (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: use your own private signing key stored in repo secrets.
      - name: Use private signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/echo-release.jks
            echo "Using keystore from secrets"
          fi

      - name: Build signed release APK + AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'tech4u-echo' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'echo' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'tech4u-echo' }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Rename outputs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "ECHO-v1.0.${{ github.run_number }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "ECHO-v1.0.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: ECHO-android
          path: |
            ECHO-*.apk
            ECHO-*.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ECHO v1.0.${{ github.run_number }}
          files: |
            ECHO-*.apk
            ECHO-*.aab
          body: |
            **ECHO** — your past is your enemy. Made by Tech4U.

            📱 Download the `.apk` below on your Android phone and open it to install
            (allow "Install unknown apps" for your browser if asked).

            🏪 The `.aab` file is for uploading to Google Play Console.
