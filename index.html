<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="ECHO — a one-thumb arcade shooter where your past self comes back to kill you. Same daily level for everyone on Earth.">
<meta name="author" content="Tech4U">
<meta name="theme-color" content="#05060d">
<meta property="og:title" content="ECHO — your past is your enemy">
<meta property="og:description" content="Every 20 seconds time resets and your echo replays every move and every shot. Can you outlive your past?">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060d'/%3E%3Cpath d='M27 16 9 6l4 10-4 10z' fill='%2336d6ff'/%3E%3C/svg%3E">
<title>ECHO</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05060d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Rubik,system-ui,sans-serif;color:#e8f1ff;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,#36d6ff,#a66bff);box-shadow:0 0 12px #36d6ff}
#hud{position:fixed;top:6px;left:0;right:0;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:700;font-size:15px;text-shadow:0 0 8px #000}
#hud .grp{display:flex;align-items:center;gap:8px}
#hearts span{color:#ff3d6e;font-size:18px;margin-right:2px}
#hearts span.off{color:#333a4d}
#echoes i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;box-shadow:0 0 6px currentColor}
#mute{pointer-events:auto;background:none;border:0;color:#9fb0d0;font-size:18px;padding:4px;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(5,6,13,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:24px;gap:12px}
.hidden{display:none!important}
h1{font-size:96px;font-weight:900;margin:0;line-height:1;background:linear-gradient(135deg,#36d6ff,#a66bff 50%,#ff5c8a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(102,180,255,.45))}
.sub{letter-spacing:4px;color:#6f7fa3;font-size:12px;margin-top:-4px}
.rules{max-width:330px;line-height:1.6;color:#c4d0ea;font-size:15px}
.rules b{color:#fff}
.warn{color:#ff8fab}
button.big{font-family:inherit;font-weight:900;font-size:20px;color:#05060d;background:linear-gradient(135deg,#36d6ff,#a66bff);border:0;border-radius:14px;padding:14px 44px;margin-top:8px;cursor:pointer;box-shadow:0 0 24px rgba(102,160,255,.5)}
button.big:active,button.ghost:active{transform:scale(.96)}
button.big small{display:block;font-size:11px;font-weight:400;letter-spacing:.5px;opacity:.75;margin-top:2px}
button.ghost{font-family:inherit;font-weight:700;font-size:15px;color:#c4d0ea;background:transparent;border:1.5px solid #3a4565;border-radius:12px;padding:11px 22px;cursor:pointer}
.row{display:flex;gap:10px}
.credit{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;letter-spacing:2px;color:#56628a;text-transform:uppercase}
.credit b{color:#a6b4d8}
#shareBox{width:280px;height:110px;background:#0d1020;color:#e8f1ff;border:1px solid #3a4565;border-radius:10px;padding:8px;font-family:inherit;font-size:13px}
.best{color:#6f7fa3;font-size:14px}
.score{font-size:56px;font-weight:900;line-height:1}
.cause{color:#ff8fab;font-size:17px;max-width:320px}
.rec{color:#ffe14d;font-weight:900;letter-spacing:1px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.4}}
#banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 1.5s ease-out forwards}
#banner h2{margin:0;font-size:54px;font-weight:900;text-shadow:0 0 24px currentColor}
#banner p{margin:6px 0 0;font-size:17px;color:#c4d0ea}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.96)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="hud" class="hidden">
  <div class="grp"><span id="score">0</span></div>
  <div class="grp"><span id="round">Round 1</span><span id="echoes"></span></div>
  <div class="grp"><span id="hearts"></span><button id="mute" aria-label="Mute">🔊</button></div>
</div>
<div id="banner"><h2 id="bt"></h2><p id="bs"></p></div>

<div id="menu" class="screen">
  <h1>ECHO</h1>
  <div class="sub">YOUR PAST IS YOUR ENEMY</div>
  <div class="rules">
    <b>Drag anywhere to move</b>. Shooting is automatic.<br>
    Every <b>20 seconds</b> time resets, and your <b>echo</b> from the last round returns, replaying every move and every shot.<br>
    <span class="warn">Echo bullets kill enemies… and you.</span>
  </div>
  <button class="big" id="start"><span id="dayLbl">DAILY</span><small>Same level for everyone on Earth today</small></button>
  <button class="ghost" id="endless">ENDLESS MODE</button>
  <div class="best" id="menuBest"></div>
  <div class="credit">Made by <b>Tech4U</b></div>
</div>

<div id="pause" class="screen hidden">
  <div class="score">PAUSED</div>
  <button class="big" id="resume">RESUME</button>
</div>

<div id="over" class="screen hidden">
  <div class="best">SCORE</div>
  <div class="score" id="fScore">0</div>
  <div class="rec hidden" id="newRec">NEW HIGH SCORE!</div>
  <div class="cause" id="cause"></div>
  <div class="best" id="fInfo"></div>
  <div class="best" id="modeLbl"></div>
  <button class="big" id="share">SHARE 📋</button>
  <textarea id="shareBox" class="hidden" readonly></textarea>
  <div class="best" id="copied"></div>
  <div class="row"><button class="ghost" id="again">PLAY AGAIN</button><button class="ghost" id="home">MENU</button></div>
  <div class="credit">Made by <b>Tech4U</b></div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H;
function resize(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

const RF=1200,FIRE=9,MAXG=6,PR=6;
const GC=['#ff5c8a','#ffb340','#7dff6a','#c77dff','#4dd8ff','#ffe14d','#ff7af0'];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const SPAWNS=[[.5,.62],[.25,.3],[.75,.75],[.75,.3],[.25,.75],[.5,.35]];

let state='menu',round=1,frame=0,score=0,hp=3,inv=0,recs=[],cur=null,P={x:0,y:0},aim=-Math.PI/2;
let enemies=[],pb=[],gb=[],parts=[],texts=[],shake=0,flash=0,spawnT=0,fireT=0,transT=0,tick=0,kills=0,echoKills=0,killer=null;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAY=Math.floor((Date.now()-Date.UTC(2026,10,1))/864e5)+1;
let mode='daily',rng=Math.random,combo=0,comboT=0,maxCombo=0;
let best=0;try{best=+localStorage.getItem('echo_best_en')||0}catch(e){}
let dbest=0;try{dbest=+localStorage.getItem('echo_daily_'+DAY)||0}catch(e){}
function menuInfo(){$('menuBest').textContent=(dbest?'Today: '+dbest+'  ·  ':'')+(best?'All-time: '+best:'');$('dayLbl').textContent='DAILY #'+DAY}

/* ---------- audio ---------- */
let AC=null,muted=false,OUT=null,REV=null,DIST=null,lastBoom=0,boomCount=0;
function initAudio(){try{
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.25;
    OUT=AC.createGain();OUT.gain.value=.9;OUT.connect(comp);comp.connect(AC.destination);
    // reverb tail
    const len=AC.sampleRate*1.8,ir=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    const conv=AC.createConvolver();conv.buffer=ir;REV=AC.createGain();REV.gain.value=.35;REV.connect(conv);conv.connect(OUT);
    // distortion for the crunch
    DIST=AC.createWaveShaper();const k=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;k[i]=Math.tanh(x*3.2)}DIST.curve=k;DIST.connect(OUT);DIST.connect(REV);
  }
  if(AC.state==='suspended')AC.resume();startMusic()}catch(e){}}
let nbuf=null;
function nb(){if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}return nbuf}
function env(g,t,v,a,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(f,d,type,v,f2,dest,t0){if(!AC||muted)return;const t=t0||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,v||.05,.004,d);o.connect(g);g.connect(dest||OUT);o.start(t);o.stop(t+d+.05)}
function noise(d,v,type,f1,f2,dest,q){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=nb();s.playbackRate.value=.8+Math.random()*.4;f.type=type||'lowpass';f.Q.value=q||.7;f.frequency.setValueAtTime(f1,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+d);
  env(g,t,v,.003,d);s.connect(f);f.connect(g);g.connect(dest||OUT);s.start(t,Math.random()*1.5);s.stop(t+d+.05)}
// BOOM: sub thump + distorted rumble + crack + debris, size 1=normal 2=big 3=huge
function boom(size){if(!AC||muted)return;const now=AC.currentTime;
  if(now-lastBoom<.04){boomCount++;if(boomCount>2)return}else boomCount=0;lastBoom=now;
  const p=.85+Math.random()*.3,v=size===3?1:size===2?.8:.55;
  tone(140*p/size**.3,.35*size,'sine',v,30,OUT);                    // sub kick
  tone(90*p,.25*size,'triangle',v*.5,25,DIST);                      // body
  noise(.5*size,v*.7,'lowpass',2600*p,90,DIST);                     // rumble
  noise(.06,v*.45,'highpass',2500,null,OUT);                        // crack
  if(size>1){noise(.9*size,v*.35,'bandpass',600,80,REV,1.5);         // long tail
    for(let i=0;i<4*size;i++)setTimeout(()=>noise(.05+Math.random()*.08,v*.12,'bandpass',800+Math.random()*2500,null,REV,4),80+Math.random()*350*size)} // debris
}
const sfx={
  shoot:()=>{if(!AC||muted)return;const f=1500+Math.random()*200;tone(f,.07,'square',.025,f*.35);tone(f*.5,.05,'sine',.02,f*.2)},
  boom:(s)=>boom(s||1),
  hit:()=>{boom(3);tone(400,.6,'sawtooth',.25,40,DIST);noise(1.2,.4,'lowpass',5000,60,REV)},
  round:()=>{if(!AC||muted)return;const t=AC.currentTime;[523,659,784,1046,1318].forEach((f,i)=>{tone(f,.18,'square',.05,null,REV,t+i*.07);tone(f,.18,'triangle',.07,null,OUT,t+i*.07)});noise(.8,.15,'highpass',800,8000,REV)},
  combo:(n)=>{if(!AC||muted)return;const sc=[0,3,5,7,10,12,15,17,19,22];const m=72+sc[Math.min(n,sc.length-1)];tone(mf(m),.18,'triangle',.12,null,REV);tone(mf(m+7),.12,'square',.04,null,OUT)},
  over:()=>{boom(3);if(!AC||muted)return;const t=AC.currentTime;[392,330,262,196].forEach((f,i)=>tone(f,.45,'sawtooth',.08,f*.97,DIST,t+.3+i*.22))}
};
/* ---------- adaptive music: every echo adds a layer ---------- */
const BPM=124,SD=60/BPM/4;let MUS=null,mStep=0,mNext=0,mTimer=null;
const ROOT=[45,41,48,43],CH=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]];
const HOOK=[76,0,0,76,0,0,74,0,72,0,74,0,76,0,0,0, 77,0,0,77,0,0,76,0,74,0,72,0,69,0,0,0, 72,0,0,72,0,0,74,0,76,0,79,0,76,0,0,0, 74,0,0,74,0,0,72,0,71,0,67,0,71,0,74,0];
const mf=m=>440*Math.pow(2,(m-69)/12);
function mnoise(t,d,v,type,f,dest){const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();s.buffer=nb();fl.type=type;fl.frequency.value=f;env(g,t,v,.002,d);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random()*1.5);s.stop(t+d+.05)}
function musLevel(){return state==='playing'||state==='trans'?recs.length:state==='menu'?-1:-9}
function schedule(){if(!AC)return;
  if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.12){playStep(mStep,mNext);mStep=(mStep+1)%64;mNext+=SD}}
function playStep(s,t){const L=musLevel();if(muted||L<-1)return;
  const bar=s>>4,b=s%16,ch=CH[bar],M=MUS;
  // arp (always, even in menu)
  const an=ch[b%3]+(b%6>2?12:0);tone(mf(an),SD*.9,'square',L<0?.025:.035,null,REV,t);
  if(L<0)return;
  // four on the floor + offbeat bass
  if(b%4===0)tone(150,.22,'sine',.55,38,M,t);
  if(b%4===2)tone(mf(ROOT[bar]),SD*1.8,'sawtooth',.12,null,M,t);
  if(b%4===2)tone(mf(ROOT[bar]+12),SD*1.2,'square',.05,null,M,t);
  // echo 1+: hats + clap
  if(L>=1){if(b%2===1)mnoise(t,.03,.07,'highpass',8000,M);if(b===4||b===12)mnoise(t,.14,.22,'bandpass',1500,REV)}
  // echo 2+: the hook
  if(L>=2&&HOOK[s]){tone(mf(HOOK[s]),SD*2.6,'square',.07,null,M,t);tone(mf(HOOK[s])*1.005,SD*2.6,'sawtooth',.035,null,REV,t)}
  // echo 3+: pads
  if(L>=3&&b===0)ch.forEach(n=>tone(mf(n),SD*15,'sawtooth',.03,null,REV,t));
  // echo 4+: double-time kick + octave hook
  if(L>=4){if(b%4===3&&b!==15)tone(130,.15,'sine',.35,40,M,t);if(HOOK[s])tone(mf(HOOK[s]+12),SD*1.5,'triangle',.05,null,REV,t)}
}
function startMusic(){if(mTimer||!AC)return;MUS=AC.createGain();MUS.gain.value=.55;MUS.connect(OUT);mTimer=setInterval(schedule,25)}

$('mute').onclick=e=>{e.stopPropagation();muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};

/* ---------- input ---------- */
let drag=null,mvx=0,mvy=0;const keys={};const SENS=1.5;
cv.addEventListener('pointerdown',e=>{initAudio();drag={x:e.clientX,y:e.clientY,id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;mvx+=(e.clientX-drag.x)*SENS;mvy+=(e.clientY-drag.y)*SENS;drag.x=e.clientX;drag.y=e.clientY});
const up=e=>{if(drag&&e.pointerId===drag.id)drag=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Escape'||e.code==='KeyP'){if(state==='playing')pause();else if(state==='paused')resume()}});
addEventListener('keyup',e=>{keys[e.code]=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='playing')pause();sleepAudio()}});

/* ---------- flow ---------- */
function show(id,on){$(id).classList.toggle('hidden',!on)}
function banner(t,s,c){const b=$('banner');$('bt').textContent=t;$('bt').style.color=c||'#fff';$('bs').textContent=s||'';b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function newGame(m){initAudio();mode=m||mode;rng=mulberry(mode==='daily'?DAY*9973+7:(Date.now()|0));combo=0;comboT=0;maxCombo=0;round=1;score=0;hp=3;recs=[];kills=0;echoKills=0;killer=null;parts=[];texts=[];show('menu',0);show('over',0);show('hud',1);startRound()}
function startRound(){
  frame=0;cur=new Float32Array(RF*3);const sp=SPAWNS[(round-1)%SPAWNS.length];P={x:W*sp[0],y:H*sp[1]};aim=-Math.PI/2;mvx=mvy=0;
  enemies=[];pb=[];gb=[];inv=90;spawnT=40;fireT=20;
  for(const g of recs){g.x=g.d[0];g.y=g.d[1];g.a=-Math.PI/2}
  state='playing';
  banner('ROUND '+round,recs.length?(recs.length===1?'Your first echo joins the fight':recs.length+' echoes in the arena'):'Survive 20 seconds',recs.length?recs[recs.length-1].c:'#36d6ff');
}
function endRound(){
  recs.push({d:cur,c:GC[(round-1)%GC.length],r:round,x:0,y:0,a:0});
  if(recs.length>MAXG)recs.shift();
  score+=100*round;
  for(const e of enemies)burst(e.x,e.y,col(e),14,4);if(enemies.length)setTimeout(()=>sfx.boom(2),500);
  enemies=[];pb=[];gb=[];
  if(round%3===0&&hp<3){hp++;texts.push({x:W/2,y:H/2+60,s:'+❤',c:'#ff3d6e',t:0})}
  round++;state='trans';transT=100;flash=.5;sfx.round();
  banner('ECHO SAVED','Round '+(round-1)+' will come back to haunt you',recs[recs.length-1].c);
}
function pause(){state='paused';show('pause',1)}
function resume(){initAudio();show('pause',0);state='playing'}
function gameOver(){
  state='over';sfx.over();
  const nr=score>best;if(nr){best=score;try{localStorage.setItem('echo_best_en',best)}catch(e){}}
  if(mode==='daily'&&score>dbest){dbest=score;try{localStorage.setItem('echo_daily_'+DAY,dbest)}catch(e){}}
  $('modeLbl').textContent=mode==='daily'?'DAILY #'+DAY+' — same level for everyone today':'ENDLESS';$('copied').textContent='';
  $('fScore').textContent=score;show('newRec',nr);
  $('cause').textContent=killer&&killer.src==='echo'?'Shot down by your own echo from round '+killer.r+' 😅':'An enemy got you';
  $('fInfo').textContent='Reached round '+round+' · '+kills+' kills ('+echoKills+' by echoes) · Max combo '+maxCombo;
  setTimeout(()=>{show('hud',0);show('over',1)},900);
}
$('start').onclick=()=>newGame('daily');$('endless').onclick=()=>newGame('endless');$('again').onclick=()=>newGame();$('share').onclick=share;$('home').onclick=toMenu;
function toMenu(){show('over',0);show('pause',0);show('hud',0);show('menu',1);state='menu';$('bar').style.width='0';menuInfo()}
window.echoBack=()=>{if(state==='playing'){pause();return 'ok'}if(state==='paused'||state==='over'){toMenu();return 'ok'}if(state==='trans')return 'ok';return 'exit'};
function sleepAudio(){try{if(AC&&AC.state==='running')AC.suspend()}catch(e){}}
addEventListener('apppause',()=>{if(state==='playing')pause();sleepAudio()});$('resume').onclick=resume;

const PLAY_URL=/^https?:/.test(location.protocol)?location.origin+location.pathname:'';
function shareText(){const sq=['🟥','🟧','🟩','🟪','🟦','🟨','🟫'];let e='';for(let i=0;i<round-1;i++)e+=sq[i%sq.length];
  return (mode==='daily'?'ECHO Daily #'+DAY:'ECHO Endless')+' 🔁\n'+e+(e?' ':'')+'💀 Round '+round+'\n'+score.toLocaleString('en-US')+' pts · combo x'+maxCombo+'\n'+
  (killer&&killer.src==='echo'?'Killed by my own past self 😅':'Can you outlive your past?')+'\nby Tech4U'+(PLAY_URL?' · '+PLAY_URL:'')}
function share(){const t=shareText();let ok=false;
  if(window.Android&&Android.share){Android.share(t);$('copied').textContent='';return}
  try{navigator.clipboard.writeText(t).then(()=>{$('copied').textContent='Copied! Paste it anywhere 📋'},()=>fallback(t));ok=true}catch(e){}
  if(!ok)fallback(t)}
function fallback(t){const a=$('shareBox');a.value=t;a.classList.remove('hidden');a.select();$('copied').textContent='Copy the text above'}

/* ---------- helpers ---------- */
function col(e){return e.type==='tank'?'#b061ff':e.type==='dash'?'#ffa630':'#ff3d6e'}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){if(parts.length>500)parts.shift();const a=Math.random()*TAU,s=Math.random()*sp+.5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,l:25+Math.random()*25,c,s:1+Math.random()*2.5})}}
function nearest(){let b=null,bd=1e9;for(const e of enemies){if(e.warn>0)continue;const d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<bd){bd=d;b=e}}return b}
function spawnEnemy(){
  let x,y,n=0;do{x=30+rng()*(W-60);y=60+rng()*(H-90);n++}while(Math.hypot(x-P.x,y-P.y)<180&&n<25);
  const r=rng();let e;
  if(round>=3&&r<.14)e={type:'tank',r:18,hp:5,sp:.6};
  else if(round>=2&&r<.42)e={type:'dash',r:11,hp:1,sp:.5,st:0,stT:40+rng()*50,dx:0,dy:0};
  else e={type:'chase',r:11,hp:1,sp:Math.min(2.7,1+round*.14)};
  e.x=x;e.y=y;e.warn=45;e.rot=Math.random()*TAU;e.max=e.hp;e.hitT=0;
  enemies.push(e);
}
let spawned=[];
function kill(e,echo,c){
  e.dead=1;kills++;if(echo)echoKills++;
  if(comboT>0)combo++;else combo=1;comboT=80;if(combo>maxCombo)maxCombo=combo;
  const mult=Math.min(5,1+Math.floor((combo-1)/4));const pts=(echo?5:10)*round*mult;score+=pts;
  if(combo>=4&&combo%4===0){texts.push({x:e.x,y:e.y-18,s:'x'+mult+' COMBO',c:'#ffe14d',t:0});sfx.combo(combo/4)}
  burst(e.x,e.y,col(e),e.type==='tank'?30:16,e.type==='tank'?5:3.5);shake=Math.max(shake,e.type==='tank'?9:4);sfx.boom(e.type==='tank'?2:1);
  if(echo)texts.push({x:e.x,y:e.y,s:'+'+pts,c:c,t:0});
  if(e.type==='tank')for(let i=0;i<3;i++){const a=i/3*TAU;spawned.push({type:'chase',r:8,hp:1,sp:Math.min(3,1.4+round*.14),x:e.x+Math.cos(a)*14,y:e.y+Math.sin(a)*14,warn:0,rot:0,max:1,hitT:0})}
}
function hit(src,r){
  hp--;inv=100;combo=0;comboT=0;shake=16;flash=.7;sfx.hit();burst(P.x,P.y,'#36d6ff',40,6);
  for(const e of enemies)if(Math.hypot(e.x-P.x,e.y-P.y)<150){e.dead=1;burst(e.x,e.y,col(e),10,3)}
  enemies=enemies.filter(e=>!e.dead);
  gb=gb.filter(b=>Math.hypot(b.x-P.x,b.y-P.y)>110);
  if(hp<=0){killer={src,r};hp=0;burst(P.x,P.y,'#fff',60,8);gameOver()}
}
function bulletsVsEnemies(arr,echo){
  for(let i=arr.length-1;i>=0;i--){const b=arr[i];
    for(const e of enemies){if(e.dead||e.warn>0)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=e.r+4;
      if(dx*dx+dy*dy<rr*rr){e.hp--;e.hitT=6;arr.splice(i,1);if(e.hp<=0)kill(e,echo,b.c);else burst(b.x,b.y,'#fff',4,2);break}}}
}
function stepBullets(arr){for(let i=arr.length-1;i>=0;i--){const b=arr[i];b.x+=b.vx;b.y+=b.vy;b.t++;if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20||b.t>160)arr.splice(i,1)}}

/* ---------- update ---------- */
function updFx(){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;if(++p.t>p.l)parts.splice(i,1)}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=.7;if(++t.t>60)texts.splice(i,1)}
  shake*=.88;flash*=.9;
}
function update(){
  tick++;
  if(state==='trans'){if(--transT<=0)startRound();updFx();return}
  if(state!=='playing'){updFx();return}
  // move
  let dx=mvx,dy=mvy;mvx=mvy=0;const k=5;
  if(keys.ArrowLeft||keys.KeyA)dx-=k;if(keys.ArrowRight||keys.KeyD)dx+=k;if(keys.ArrowUp||keys.KeyW)dy-=k;if(keys.ArrowDown||keys.KeyS)dy+=k;
  P.x=clamp(P.x+dx,12,W-12);P.y=clamp(P.y+dy,40,H-12);
  // fire
  let a=NaN;
  if(--fireT<=0){const t=nearest();if(t){a=Math.atan2(t.y-P.y,t.x-P.x);aim=a;pb.push({x:P.x,y:P.y,vx:Math.cos(a)*10,vy:Math.sin(a)*10,t:0});fireT=FIRE;sfx.shoot()}}
  const fi=frame*3;cur[fi]=P.x;cur[fi+1]=P.y;cur[fi+2]=a;
  // echoes replay
  for(const g of recs){g.x=g.d[fi];g.y=g.d[fi+1];const ga=g.d[fi+2];
    if(!isNaN(ga)){g.a=ga;gb.push({x:g.x,y:g.y,vx:Math.cos(ga)*6.5,vy:Math.sin(ga)*6.5,t:0,c:g.c,r:g.r})}}
  // spawn
  if(--spawnT<=0){spawnEnemy();spawnT=Math.max(14,62-round*7)*(.7+rng()*.6)}
  // enemies
  for(const e of enemies){
    e.rot+=.05;if(e.hitT>0)e.hitT--;
    if(e.warn>0){e.warn--;continue}
    const an=Math.atan2(P.y-e.y,P.x-e.x);
    if(e.type==='dash'){
      if(e.st===0){e.x+=Math.cos(an)*e.sp;e.y+=Math.sin(an)*e.sp;if(--e.stT<=0){e.st=1;e.stT=32;e.dx=Math.cos(an);e.dy=Math.sin(an)}}
      else if(e.st===1){if(--e.stT<=0){e.st=2;e.stT=22}}
      else{e.x+=e.dx*8.5;e.y+=e.dy*8.5;if(--e.stT<=0){e.st=0;e.stT=60+rng()*30}}
    }else{e.x+=Math.cos(an)*e.sp;e.y+=Math.sin(an)*e.sp}
  }
  // separation
  for(let i=0;i<enemies.length;i++){const A=enemies[i];if(A.warn>0)continue;for(let j=i+1;j<enemies.length;j++){const B=enemies[j];if(B.warn>0)continue;
    const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,m=A.r+B.r;if(d<m){const p=(m-d)/2/d;A.x-=dx*p;A.y-=dy*p;B.x+=dx*p;B.y+=dy*p}}}
  for(const e of enemies){e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,e.r+30,H-e.r)}
  // bullets
  stepBullets(pb);stepBullets(gb);
  spawned=[];
  bulletsVsEnemies(pb,false);bulletsVsEnemies(gb,true);
  enemies=enemies.filter(e=>!e.dead).concat(spawned);
  // damage to player
  if(inv>0)inv--;if(comboT>0&&--comboT===0)combo=0;
  else{
    for(const b of gb){if(b.t>14&&(b.x-P.x)**2+(b.y-P.y)**2<(PR+3)**2){hit('echo',b.r);break}}
    if(state==='playing'&&inv<=0)for(const e of enemies){if(e.warn>0)continue;if((e.x-P.x)**2+(e.y-P.y)**2<(e.r+PR)**2){hit('enemy');break}}
  }
  if(state==='playing'&&++frame>=RF)endRound();
  updFx();
}

/* ---------- draw ---------- */
function ship(x,y,a,fill,stroke,s){s=s||1;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(14*s,0);ctx.lineTo(-9*s,-9*s);ctx.lineTo(-4*s,0);ctx.lineTo(-9*s,9*s);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}ctx.restore()}
function poly(x,y,r,n,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*TAU;i?ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);const d=cv.width/W;ctx.setTransform(d,0,0,d,0,0);
  ctx.fillStyle='#05060d';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>.3)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  // grid
  const off=(tick*.3)%40,pulse=state==='trans'?.12:.05;
  ctx.strokeStyle='rgba(80,120,255,'+pulse+')';ctx.lineWidth=1;ctx.beginPath();
  for(let x=-off;x<W;x+=40){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=off;y<H;y+=40){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();

  // transition: draw newest echo path
  if(state==='trans'&&recs.length){const g=recs[recs.length-1],n=Math.floor((1-transT/100)*RF);
    ctx.strokeStyle=g.c;ctx.globalAlpha=.6;ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<n;i+=2){const x=g.d[i*3],y=g.d[i*3+1];i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
    if(n>0){const i=(n-1)*3;ship(g.d[i],g.d[i+1],-Math.PI/2,null,g.c,1.2)}
    ctx.globalAlpha=1}

  if(state==='playing'||state==='paused'||state==='over'){
    // echoes
    for(let gi=0;gi<recs.length;gi++){const g=recs[gi],al=.35+.5*(gi+1)/recs.length;
      ctx.globalAlpha=al*.45;ctx.strokeStyle=g.c;ctx.lineWidth=3;ctx.beginPath();
      for(let f=Math.max(0,frame-16);f<=frame&&f<RF;f++){const x=g.d[f*3],y=g.d[f*3+1];f===Math.max(0,frame-16)?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
      ctx.globalAlpha=al;ctx.shadowColor=g.c;ctx.shadowBlur=12;ship(g.x,g.y,g.a,null,g.c);ctx.shadowBlur=0;
      ctx.fillStyle=g.c;ctx.font='bold 10px Rubik,sans-serif';ctx.textAlign='center';ctx.fillText(g.r,g.x,g.y+24);ctx.globalAlpha=1}
    // enemies
    for(const e of enemies){const c=col(e);
      if(e.warn>0){const p=1-e.warn/45;ctx.strokeStyle=c;ctx.globalAlpha=.3+.5*Math.abs(Math.sin(tick*.3));ctx.setLineDash([4,4]);ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(e.x,e.y,e.r+18*(1-p),0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;continue}
      ctx.shadowColor=c;ctx.shadowBlur=14;ctx.fillStyle=e.hitT>0?'#fff':c;
      if(e.type==='chase'){poly(e.x,e.y,e.r,4,e.rot);ctx.fill()}
      else if(e.type==='dash'){
        if(e.st===1){ctx.shadowBlur=0;ctx.strokeStyle=c;ctx.globalAlpha=.25+.4*Math.abs(Math.sin(tick*.5));ctx.lineWidth=e.r*2;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+e.dx*190,e.y+e.dy*190);ctx.stroke();ctx.globalAlpha=1;ctx.shadowBlur=14}
        const a=e.st>0?Math.atan2(e.dy,e.dx):Math.atan2(P.y-e.y,P.x-e.x);poly(e.x,e.y,e.r+2,3,a);ctx.fill()}
      else{poly(e.x,e.y,e.r,6,e.rot*.4);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+6,-Math.PI/2,-Math.PI/2+TAU*e.hp/e.max);ctx.stroke()}
      ctx.shadowBlur=0}
    // bullets
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='#8ff0ff';for(const b of pb){ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,TAU);ctx.fill()}
    for(const b of gb){const live=b.t>14;ctx.globalAlpha=live?1:.35;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,live?4.5:3,0,TAU);ctx.fill();
      if(live){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,1.8,0,TAU);ctx.fill()}}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    // player
    if(state!=='over'&&(inv<=0||Math.floor(tick/4)%2)){ctx.shadowColor='#36d6ff';ctx.shadowBlur=18;ship(P.x,P.y,aim,'#36d6ff','#e8fbff');ctx.shadowBlur=0;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.x,P.y,2,0,TAU);ctx.fill()}
  }
  // particles
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){ctx.globalAlpha=1-p.t/p.l;ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // texts
  ctx.textAlign='center';ctx.font='bold 14px Rubik,sans-serif';
  for(const t of texts){ctx.globalAlpha=1-t.t/60;ctx.fillStyle=t.c;ctx.fillText(t.s,t.x,t.y)}ctx.globalAlpha=1;
  ctx.restore();
  if(flash>.02){ctx.fillStyle='rgba(255,255,255,'+flash*.35+')';ctx.fillRect(0,0,W,H)}
  // menu attract
  if(state==='menu'){for(let i=0;i<5;i++){const t=tick*.012+i*1.3,x=W/2+Math.cos(t*1.3+i)*W*.35,y=H/2+Math.sin(t*.9+i*2)*H*.35;
    ctx.globalAlpha=.5;ship(x,y,Math.atan2(Math.cos(t*.9+i*2)*.9,-Math.sin(t*1.3+i)*1.3),null,GC[i]);ctx.globalAlpha=1}}
  // HUD
  if(state==='playing'||state==='paused'){
    $('bar').style.width=(frame/RF*100)+'%';
    $('score').textContent=score;$('round').textContent='Round '+round;
  }else if(state!=='over')$('bar').style.width='0';
}
let lastHUD='';
function hud(){const k=hp+'|'+recs.length+'|'+recs.map(g=>g.c).join();if(k===lastHUD)return;lastHUD=k;
  let h='';for(let i=0;i<3;i++)h+='<span class="'+(i<hp?'':'off')+'">♥</span>';$('hearts').innerHTML=h;
  $('echoes').innerHTML=recs.map(g=>'<i style="background:'+g.c+';color:'+g.c+'"></i>').join('')}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(t){acc+=Math.min(100,t-last);last=t;let n=0;while(acc>=STEP&&n<5){update();acc-=STEP;n++}if(n===5)acc=0;draw();hud();requestAnimationFrame(loop)}
menuInfo();requestAnimationFrame(loop);
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
